[project]
name = "mech-interp-research"
version = "0.1.0"
description = "SAE fine-tuning pipeline on Gemma-2-2b activations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.3",
    "transformers>=4.45",
    "pandas>=2.2",
    "tqdm>=4.66",
    "safetensors>=0.4",
    "pyyaml>=6.0",
    "modal>=0.64",
    "sae-lens>=0.3",
    "scipy>=1.13",
    "wandb>=0.16",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pre-commit>=3.8",
    "pytest>=8.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mech_interp_research"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = [
    "E501",   # line length handled by formatter
    "N803",   # uppercase argument names (X, Y are standard math/ML notation)
    "N806",   # uppercase variable names (W_enc, W_dec, X, Y, M1, M0, N are standard)
]
