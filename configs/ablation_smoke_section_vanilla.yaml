# Causal ablation SMOKE — VANILLA SAE, SECTION-LOCAL loss (#5), 250 notes, 4 targets.
#
# Validates the section-local measurement end-to-end before the full re-run:
#   - build_section_mask parses the discharge-diagnosis span via header regex
#     + tokenizer offset mapping.
#   - per pass (clean/recon/each ablated) we also measure CE over the section
#     tokens vs the rest of the note; the standard final-25% window is unchanged.
#
# What good looks like in the printed summary:
#   - a "section_coverage" block with frac_notes_with_section > 0 (the parser
#     fires on real discharge summaries) and a sensible mean_section_tokens.
#   - loss_*_section / loss_*_rest populated (not all NaN) for notes with a
#     section; and per-note n_section_tokens + n_rest_tokens == real prediction
#     positions (the partition invariant — the key correctness check).
#   - mean_recon_tax + the window-based Cliff's delta unchanged vs the original
#     smoke (this run only ADDS measurements; the intervention is still zero).
#
# Expected runtime: ~40 min on A100-40GB.
#
# Run:
#   modal run modal_app/ablation.py --config-file configs/ablation_smoke_section_vanilla.yaml

# --- SAE identity ----------------------------------------------------------
sae_name: vanilla_section_smoke
sae_checkpoint_dir: "/out/saes/sae_d2304_e8_l11e+01_20260505T205723Z/best"
sae_hf_repo_id: null
sae_hf_filename: null
is_centered: true

# --- Section-local measurement (#5) ----------------------------------------
intervention: zero          # unchanged intervention; we only add measurements
measure_sections: true
# section_headers omitted → uses the dataclass default:
#   ["discharge diagnos[ie]s", "final diagnos[ie]s", "discharge diagnosis"]

# --- Activations / model ---------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
mean_path: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered/mean.pt
centered_activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
model_name: google/gemma-2-2b
layer: 16

# --- Held-out shards -------------------------------------------------------
held_out_shard_start: 281
held_out_shard_end: 312

# --- ICD label join --------------------------------------------------------
icd_csv_path: /data/sample_50k.csv
join_key: admission_id
text_col: note_text
icd_col_prefix: "icd9_"

# --- Targets (same 4 as the original vanilla smoke) ------------------------
targets:
  - feature_idx: 10520
    code: icd9_5856
    kind: grounded
    r_pb: 0.8595
  - feature_idx: 8823
    code: icd9_2449
    kind: grounded
    r_pb: 0.8581
  - feature_idx: 3593
    code: icd9_25000
    kind: random_control
    r_pb: null
  - feature_idx: 16773
    code: icd9_5849
    kind: low_r_control
    r_pb: -0.1002

# --- Forward / measurement -------------------------------------------------
max_length: 8192
loss_window_frac: 0.25
min_loss_window_tokens: 32
batch_size: 1
max_notes: 250

# --- Output ----------------------------------------------------------------
output_dir: /out/ablation/vanilla_section_smoke
shard_checkpoint_subdir: shard_results
save_per_note_records: true

# --- Misc ------------------------------------------------------------------
seed: 42
logging_level: INFO
