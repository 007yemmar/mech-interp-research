# Third judge (OpenAI GPT-5-mini) — CROSS-chapter forced-choice retrieval, jr_pub.
# The easy slate (distractors from a DIFFERENT ICD-9 chapter) that judges 3 and 4
# never ran; pairs with the existing ret_hn_* same-chapter runs to give the
# cross→same-chapter delta a column per judge without DeepSeek.
#
# icd_eval_dir is the SOURCE'S OWN audit dir, matching
# configs/fourarm/r2_retrieval_*.yaml — NOT the JumpReLU matrix the ret_hn_*
# configs use. It supplies the r_pb row that filters distractor candidates
# (concordance_multi_judge.build_discriminative_slate), and cross-chapter pools
# are 37–45 codes against 7 needed, so the |r| filter binds and the choice of
# matrix genuinely changes the slate. Getting this wrong would compare judges
# under different slates.
#
# output_dir is set EXPLICITLY. Leaving it null resolves to the same path, but
# these configs carry a standing warning that a null default has previously
# overwritten published cross-chapter results.
#
# Run: uv run modal run --detach modal_app/retrieval_eval.py --config-file configs/judge3/ret_jr_pub.yaml --detach

auto_interp_dir: ${jumprelu_s0_auto_interp}
icd_eval_dir:    ${jumprelu_s0_eval}
icd_csv_path:    /data/sample_50k.csv
icd_keywords_yaml_path: /root/configs/icd9_keywords_improved.yaml
output_dir: ${jumprelu_s0_auto_interp}/retrieval_eval

judges:
  - {slug: gpt-5-mini, backend: openrouter, model: openai/gpt-5-mini, reasoning_effort: minimal}

same_chapter_distractors: false
n_distractors: 7
r_unrelated: 0.05
thresholds: [0.3, 0.5]
max_workers: 4
logging_level: INFO
