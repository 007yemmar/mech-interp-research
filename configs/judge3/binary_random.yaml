# Third judge (OpenAI GPT-5-mini) — forced-binary YES/NO concordance, random.
# PARTIAL removed from the option set; explanations held fixed, so only the
# option set changes. Completes the arm that RESULTS.md §14.7d records as
# Sonnet + DeepSeek only, so the panel can be reported without DeepSeek.
#
# Setup is byte-identical to configs/fourarm/binary_random.yaml apart from the
# judge: same auto_interp_dir, same output_dir, same prompt and max_tokens.
# max_workers only changes throughput — each verdict is an independent call.
#
# Run: uv run modal run --detach modal_app/binary_judge_eval.py --config-file configs/judge3/binary_random.yaml --detach

auto_interp_dir: /out/auto_interp/judgetest/random_hard
output_dir: /out/auto_interp/judgetest/random_hard/binary_eval

judges:
  - {slug: gpt-5-mini, backend: openrouter, model: openai/gpt-5-mini, reasoning_effort: minimal}

max_workers: 4
logging_level: INFO
