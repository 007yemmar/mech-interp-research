# Feature source: keyword_b2 -- B1 diluted with an unrelated cross-chapter
# code's keyword direction until its SELECTION-set on-target |r| matches Arm
# C's for that code (spec Sec 4.2.2). This is the load-bearing sensitivity
# control: a genuine lexical signal at the difficulty the trained SAE
# actually operates at, rather than an unmistakable one (keyword_b1).
#
# The dilution partner for each code is another code's keyword direction
# (from the same scan), drawn deterministically from `seed`, restricted to a
# different ICD-9 chapter -- the same cross-chapter rule
# concordance_multi_judge.py's retrieval slate uses for distractors. Both the
# chosen partner and the solved alpha are recorded per code in
# source_meta.json (dilution_partner_code / dilution_alpha). A code where
# even the undiluted B1 direction already correlates more weakly than Arm
# C's target is recorded in dilution_unreachable_codes rather than silently
# dropped or crashing the run (spec Sec 10: "report those codes as a count").
#
# Run:
#   uv run modal run modal_app/build_feature_source.py --config-file configs/source_keyword_b2.yaml

arm: keyword_b2
output_dir: /out/sources/keyword_b2_bosfix

activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
icd_csv_path: /data/sample_50k.csv
icd_keywords_yaml_path: /root/configs/icd9_keywords_improved.yaml
model_name: google/gemma-2-2b
text_col: note_text
max_length: 8192

# Reference JumpReLU SAE's pooled-vector checkpoints -- drives Arm C
# selection, the per-code note-level calibration target (Ruling 1), AND
# (uniquely for this arm) the per-code dilution target |r| via
# arm_c["r_selection"] -- see source_diff_in_means.yaml for the first two.
sae_shard_ckpt_dir: /out/icd_eval/jumprelu_d2304_e8_l01e+01_bw1e+00_20260519T084742Z/shard_ckpt
arm_c_selected_features_path: /out/sources/_shared/arm_c_selected_features.json

held_out_shard_start: 281

target_density: 0.002220     # reported-only, see source_diff_in_means.yaml
calibration_n_shards: 6
calibration_notes_per_shard: 50    # whole notes per shard, NOT a token count (see build_feature_source.py:_sample_tokens)

scan_n_shards: 24            # selection shards scanned for keyword occurrences
min_token_positions: 200     # below this, a code is reported as underpowered

alpha_max: 32.0               # dilution search upper bound on alpha

join_key: admission_id
icd_col_prefix: "icd9_"
min_prevalence: 0.02
max_codes: 50
min_notes: 100

seed: 42
logging_level: INFO
