# Causal ablation EXTENDED pilot — vanilla SAE, 20 additional grounded features.
#
# Companion to ablation_pilot_vanilla.yaml. Same SAE, same notes, same methodology.
# This run characterises features at ranks 11–30 by |r_pb| (the top 10 already
# tested in the original pilot). Together the two runs give 30 grounded features
# characterised — much more robust validation rates and broader code coverage.
#
# No controls in this config — the original pilot already has 2 controls
# (feature 3593 random + 16773 low-r), both correctly null at scale. The
# analysis can pool controls from both runs.
#
# Code coverage of these 20 features (12 distinct codes, vs 3 in ranks 1-10):
#   icd9_2449 (hypothyroidism)        : 4 features (7304, 17588, 4152, 3537)
#   icd9_42731 (atrial fibrillation)  : 4 features (9809, 1387, 11445, 7116)
#   icd9_5856 (acute renal failure)   : 3 features (11016, 11387, 17076)
#   icd9_4280 (heart failure)         : 2 features (16170, 8363)
#   icd9_53081 (GERD)                 : 2 features (15117, 3764)
#   icd9_V4581 (cardiac stent)        : 2 features (6433, 3340)
#   icd9_73300 (osteoporosis)         : 1 feature  (4393)
#   icd9_2749  (gout)                 : 1 feature  (10188)
#   icd9_60000 (BPH)                  : 1 feature  (1042)
#
# Expected runtime: ~5 h on A100-40GB (22 forwards/note × 4911 notes × 165 ms).
#
# Run (detached, resumable):
#   modal run --detach modal_app/ablation.py --config-file configs/ablation_pilot_vanilla_extended.yaml --detach
#
# Resume: re-running the same command picks up from the last completed shard.
# Per-shard JSONs land in /out/ablation/vanilla_pilot_extended/shard_results/.

# --- SAE identity ----------------------------------------------------------
sae_name: vanilla_pilot_extended

sae_checkpoint_dir: /out/saes/sae_d2304_e8_l11e+01_20260505T205723Z/best
sae_hf_repo_id: null
sae_hf_filename: null
is_centered: true

# --- Activations / model ---------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
