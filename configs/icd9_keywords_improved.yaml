# Lexical keyword dictionary for ICD-9 clinical grounding baseline (IMPROVED).
#
# Sources: ICD-9-CM descriptions, clinical abbreviations, common medications,
# distinctive lab values / procedures, clinical note phrasing, discharge summary
# conventions. No UMLS dependency.
#
# Matching rules (implemented in lexical_baseline.py):
#   - Default: case-insensitive substring match
#   - Keywords ≤3 characters: word-boundary regex (\bKEYWORD\b) to avoid
#     false positives in longer strings
#
# Expansion strategy vs original:
#   - Added broader medication coverage (generic + brand, all major drug classes)
#   - Added clinical abbreviations used in notes (PMH, vitals, labs)
#   - Added symptom / physical-exam language (dyspnea, edema, crackles, etc.)
#   - Added procedure / imaging terms (echo, cath, CXR findings)
#   - Added lab-value / biomarker references
#   - Avoided hyper-specific MIMIC phrasing to keep generalisability
#
# One entry per icd9_* column name from the eval. Codes not listed here are
# skipped in the baseline comparison (reported as "no keywords").

