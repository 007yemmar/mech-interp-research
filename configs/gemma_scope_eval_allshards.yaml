# GemmaScope SAE evaluation — ALL shards.
#
# Continues the GemmaScope ICD eval on all 312 shards (matching vanilla eval)
# with diagnostics skipped (already computed on eval shards).
# Resumes from existing shard_ckpt (4/312 done).
#
# Run:
#   modal run modal_app/gemma_scope_eval.py --config-file configs/gemma_scope_eval_allshards.yaml

# --- GemmaScope HuggingFace coordinates ------------------------------------
hf_repo_id: google/gemma-scope-2b-pt-res
hf_filename: layer_16/width_16k/average_l0_42/params.npz

# --- paths -----------------------------------------------------------------
# Raw (non-centered) activations — GemmaScope was trained on raw residual stream.
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z
icd_csv_path: /data/sample_50k.csv
output_dir: /out/icd_eval/gemma_scope_16k

# --- shard selection -------------------------------------------------------
# Diagnostics already done on eval shards — skip to avoid overwriting.
skip_diagnostics: true
eval_n_shards: 31

# Use all shards for ICD grounding (0 = all). Matches vanilla eval (50k notes).
grounding_n_shards: 0

# --- domain shift analysis ------------------------------------------------
# Path to clinical mean vector (from centering step) on sae-artifacts volume.
# Enables mean-vs-b_dec comparison and re-centered EV variants.
clinical_mean_path: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered/mean.pt
domain_shift_n_shards: 5

# --- ICD eval settings (identical to vanilla for fair comparison) ----------
pooling: max
topk: 10
min_prevalence: 0.02
max_codes: 50
r_threshold: 0.1
fdr_q: 0.05
join_key: admission_id
icd_col_prefix: "icd9_"
shard_filter: null

logging_level: INFO
