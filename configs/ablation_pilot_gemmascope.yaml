# Causal ablation PILOT — GemmaScope SAE, all 4,911 held-out notes, 12 targets.
#
# Full-scale follow-up to ablation_smoke_gemmascope.yaml. Companion to
# ablation_pilot_vanilla.yaml — identical methodology, identical notes,
# only the SAE changes.
#
# Expected runtime: ~3 h on A100-40GB.
#
# Targets: top 10 features by |r_pb| (deduplicated by latent) + 1 random
# control + 1 low-r control. Generated by ablation_features.select_smoke_targets
# with n_grounded=10 against .tmp/evaluations/gemmascope/top_associations.csv.
#
# Code coverage of the 10 grounded features (better diversity than vanilla):
#   icd9_V5867 (insulin), icd9_V5861 (anticoag×2), icd9_25000 (diabetes×2),
#   icd9_2449 (hypothyroidism), icd9_311 (depression), icd9_5856 (renal),
#   icd9_53081 (GERD), icd9_V4986 (joint replacement)
# Eight distinct codes — GemmaScope's top features are less redundantly
# concentrated than vanilla's, which is itself an interesting finding for
# the writeup ("vanilla has many features per concept, GemmaScope has
# fewer features that each ground to different concepts").
#
# Key contrast vs vanilla pilot:
#   - is_centered: false           GemmaScope was trained on raw activations
#   - mean_path: null              no un-centering needed
#   - sae_checkpoint_dir: null     SAE downloaded from HF
#   - activations_dir: raw         metadata.jsonl from the non-centered dir
#   - Recon tax expected ≈ 0.64 (24× larger than vanilla — domain shift)
#
# Run (in parallel with vanilla pilot):
#   modal run --detach modal_app/ablation.py --config-file configs/ablation_pilot_gemmascope.yaml --detach

# --- SAE identity ----------------------------------------------------------
sae_name: gemma_scope_pilot

sae_checkpoint_dir: null
sae_hf_repo_id: google/gemma-scope-2b-pt-res
sae_hf_filename: layer_16/width_16k/average_l0_42/params.npz
is_centered: false

# --- Activations / model ---------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z
mean_path: null
centered_activations_dir: null

model_name: google/gemma-2-2b
layer: 16

# --- Held-out shards (identical to vanilla pilot for direct comparison) ----
held_out_shard_start: 281
held_out_shard_end: 312

# --- ICD label join --------------------------------------------------------
icd_csv_path: /data/sample_50k.csv
join_key: admission_id
text_col: note_text
icd_col_prefix: "icd9_"

# --- Targets (10 grounded + 1 random_control + 1 low_r_control) ------------
targets:
  - feature_idx: 2121
    code: icd9_V5867
    kind: grounded
    r_pb: 0.545
  - feature_idx: 1459
    code: icd9_V5861
    kind: grounded
    r_pb: 0.5384
  - feature_idx: 12322
    code: icd9_25000
    kind: grounded
    r_pb: 0.521
  - feature_idx: 15439
    code: icd9_2449
    kind: grounded
    r_pb: 0.5013
  - feature_idx: 8073
    code: icd9_311
    kind: grounded
    r_pb: 0.4951
  - feature_idx: 11693
    code: icd9_5856
    kind: grounded
    r_pb: 0.4595
  - feature_idx: 1197
    code: icd9_53081
    kind: grounded
    r_pb: 0.4574
  - feature_idx: 3015
    code: icd9_V5861
    kind: grounded
    r_pb: 0.4346
  - feature_idx: 1100
    code: icd9_V4986
    kind: grounded
    r_pb: 0.4306
  - feature_idx: 14478
    code: icd9_25000
    kind: grounded
    r_pb: 0.4278
  - feature_idx: 16193
    code: icd9_2749
    kind: random_control
    r_pb: null
  - feature_idx: 11107
    code: icd9_5849
    kind: low_r_control
    r_pb: -0.1002

# --- Forward / measurement (identical to vanilla pilot) --------------------
max_length: 8192
loss_window_frac: 0.25
min_loss_window_tokens: 32
batch_size: 1
max_notes: null  # full held-out set (~4911 notes)

# --- Output (FRESH directory) ----------------------------------------------
output_dir: /out/ablation/gemma_scope_pilot
shard_checkpoint_subdir: shard_results
save_per_note_records: true

# --- Misc ------------------------------------------------------------------
seed: 42
logging_level: INFO
