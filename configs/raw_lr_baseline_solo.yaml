# Raw-activation LR probe — Baseline 3 — SOLO mode (no SAE comparison).
#
# Run:
#   modal run --detach modal_app/raw_lr_baseline.py --config-file configs/raw_lr_baseline_solo.yaml
#
# sae_results_csv: null tells run_raw_lr_baseline to skip Steps 6-9 (SAE
# load, alignment, comparison, rename) and write only the per-code raw
# AUCs. Use this when you want AUC_raw values now and will compare against
# tfidf/SAE AUCs externally later.

# --- paths ---------------------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
icd_csv_path: /data/sample_50k.csv

sae_results_csv: null    # SOLO MODE — no SAE-side comparison

output_dir: /out/icd_eval/sae_d2304_e8_l11e+01_20260505T205723Z/posthoc/raw_lr_baseline_solo
checkpoint_dir: null    # null → <output_dir>/raw_shard_ckpt

# --- pooling -------------------------------------------------------------
pooling: max
topk: 10
shard_filter: null

# --- classification settings (identical to tfidf_lr_baseline) -----------
cv_n_splits: 5
lr_max_iter: 5000
random_state: 42
delta_auc_threshold: 0.02    # unused in solo mode but harmless

# --- label alignment (identical to icd_eval / tfidf_lr_baseline) --------
join_key: admission_id
icd_col_prefix: "icd9_"
min_prevalence: 0.02
max_codes: 50
min_notes: 100

logging_level: INFO
