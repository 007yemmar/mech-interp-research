# GemmaScope -> pseudo-SAE checkpoint, so feature_inspector/auto_interp can
# encode with it. It lives on the Hub, not the volume, and our loader takes a
# local directory.
#
# b_dec is deliberately discarded: GemmaScope's encoder is `x @ W_enc + b_enc`
# with no b_dec subtraction, and our loader subtracts b_dec by default, so
# writing zeros reproduces its encoder exactly. b_enc IS preserved — dropping it
# would shift every pre-activation and change which tokens fire.
arm: gemmascope
hf_repo_id: google/gemma-scope-2b-pt-res
hf_filename: layer_16/width_16k/average_l0_42/params.npz
output_dir: /out/sources/gemmascope_16k
expect_d_model: 2304
nonfinite_threshold_policy: inert
provenance_note: >
  External general-purpose SAE, 16,384 features. Included as a dose-response
  check: it grounds at median |r| 0.309 against the custom SAE's 0.574, so if
  the judge's verdict rate tracks feature quality it should land between the
  random floor and the custom SAE.
logging_level: INFO
