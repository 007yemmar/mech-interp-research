# Post-hoc specificity analyses (#2/#3/#4) on the original VANILLA ReLU PILOT run.
#
# The posthoc code is SAE-agnostic — it reads ablation_summary.json + shard_results/
# from whatever ablation_output_dir it's pointed at, so it runs on the original
# vanilla runs identically to jumprelu. No GPU, no forward passes.
#
# Run:
#   modal run modal_app/ablation_posthoc.py --config-file configs/ablation_posthoc_vanilla.yaml

ablation_output_dir: /out/ablation/vanilla_pilot

icd_csv_path: /data/sample_50k.csv
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered

join_key: admission_id
icd_col_prefix: "icd9_"
held_out_shard_start: 281
held_out_shard_end: 312
shard_checkpoint_subdir: shard_results
output_subdir: posthoc_specificity

restrict_true_negative: true
min_off_target_pos: 10

logging_level: INFO
