# Causal ablation SMOKE — VANILLA SAE, MEAN-ABLATION (#6), 250 notes, 4 targets.
#
# Validates the mean-ablation intervention end-to-end before the full re-run:
#   - decode_with_mean_ablation (x_hat - (z_j - m_j).W_dec[j])
#   - m_j precompute (compute_mean_latent_activations, a matmul over shards)
#   - the splice/stats pipeline is otherwise unchanged.
#
# What good looks like in the printed summary:
#   - "intervention": "mean"; the log shows an m_j range for the 4 features.
#   - mean_recon_tax is unchanged vs the zero-ablation smoke (the recon pass is
#     untouched) — a large tax would signal a centering/splice regression.
#   - the 2 grounded features' Cliff's delta should be SMALLER than the
#     zero-ablation smoke's (mean-ablation removes only the deviation from
#     baseline, not the whole feature); controls near-null. Directional at n=250.
#
# Expected runtime: ~40 min on A100-40GB.
#
# Run:
#   modal run modal_app/ablation.py --config-file configs/ablation_smoke_meanablation_vanilla.yaml

# --- SAE identity ----------------------------------------------------------
sae_name: vanilla_meanabl_smoke
sae_checkpoint_dir: "/out/saes/sae_d2304_e8_l11e+01_20260505T205723Z/best"
sae_hf_repo_id: null
sae_hf_filename: null
is_centered: true

# --- Intervention (#6) -----------------------------------------------------
intervention: mean
mean_act_path: null        # null → estimate m_j from the shards below
mean_act_n_shards: 2       # small sample for a fast smoke
mean_act_max_tokens: 100000

# --- Activations / model ---------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
mean_path: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered/mean.pt
centered_activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
model_name: google/gemma-2-2b
layer: 16

# --- Held-out shards -------------------------------------------------------
held_out_shard_start: 281
held_out_shard_end: 312

# --- ICD label join --------------------------------------------------------
icd_csv_path: /data/sample_50k.csv
join_key: admission_id
text_col: note_text
icd_col_prefix: "icd9_"

# --- Targets (same 4 as the original vanilla smoke) ------------------------
targets:
  - feature_idx: 10520
    code: icd9_5856
    kind: grounded
    r_pb: 0.8595
  - feature_idx: 8823
    code: icd9_2449
    kind: grounded
    r_pb: 0.8581
  - feature_idx: 3593
    code: icd9_25000
    kind: random_control
    r_pb: null
  - feature_idx: 16773
    code: icd9_5849
    kind: low_r_control
    r_pb: -0.1002

# --- Forward / measurement -------------------------------------------------
max_length: 8192
loss_window_frac: 0.25
min_loss_window_tokens: 32
batch_size: 1
max_notes: 250

# --- Output ----------------------------------------------------------------
output_dir: /out/ablation/vanilla_meanabl_smoke
shard_checkpoint_subdir: shard_results
save_per_note_records: true

# --- Misc ------------------------------------------------------------------
seed: 42
logging_level: INFO
