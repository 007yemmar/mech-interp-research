# Published 380-feature rule applied to the gemmascope SAE, on held-out shards.
#
# Same selection (280 strong at r>0.4 + 100 weak at 0.1-0.3), same prompts and
# thresholds as the published jumprelu run, so results drop straight into the
# R1/R2 tables. For gemmascope: only 13 of 16,384 features clear r>0.4 (vs 276 of 18,432 for jumprelu)
# and max |r| is 0.545 vs 0.864. n will be ~113, and the r>0.5 band will be
# near-empty -- that scarcity is itself the domain-specific-SAE result.

# --- paths ---
sae_checkpoint: /out/sources/gemmascope_16k
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
icd_eval_dir: /out/icd_eval/gemma_scope_16k/test_split
# 31 held-out shards, not the 312-shard full checkpoint: auto_interp's shard
# fan-out is bounded only by what note_vectors covers, and the full checkpoint
# drove an 83-minute extraction that never survived to the explainer.
shard_ckpt_dir: /out/icd_eval/gemma_scope_16k/test_split/shard_ckpt
icd_csv_path: /data/sample_50k.csv
output_dir: /out/auto_interp/gemmascope_mid

# --- feature selection ---
# explicit_features pins the pool, so the tier knobs are inert.
n_strong_grounded: 0
n_weak_grounded: 0
# Noise-floor tiers OFF. The published config carries n_non_grounded: 1000 and
# n_dead: 100, which inflated the selection to 616 (vanilla) and 1213
# (gemmascope) features. Those tiers have no ICD code, so they yield no
# concordance verdict and never enter the banded tables -- ~60% and ~90% of the
# calls respectively bought nothing reportable. They are already established
# for jumprelu, and the architecture question is answered by the grounded
# features alone. Fewer features also shrinks the shard union
# select_shards_for_features returns, so extraction shortens too.
n_non_grounded: 0
n_dead: 0
random_seed: 42

# --- explanation ---
explainer_model: claude-sonnet-4-6
comparison_model: null
n_contexts_train: 20         # activating contexts shown to the explainer
n_contexts_test: 10          # held out for scoring (5 pos, 5 neg)
max_tokens_context: 30       # +/- tokens around trigger token

# --- scoring ---
# Fuzzing/Detection do not affect the concordance verdict and are half the
# calls; the published run included them, this one does not.
scorers: []

# --- post-processing ---
concordance_model: claude-sonnet-4-6
concordance_thresholds:
  - 0.3
  - 0.4
  - 0.5

# --- ICD descriptions (for concordance prompts) ---
icd_keywords_yaml_path: /root/configs/icd9_keywords_improved.yaml

# --- tokenizer ---
model_name: google/gemma-2-2b

# --- resume ---
checkpoint_dir: null         # auto-detected from output_dir

logging_level: INFO

# GemmaScope's 41 features in |r| 0.3-0.4 -- the ONLY band it has headroom in.
# The published tier rule samples r>0.4 and 0.1-0.3, leaving 0.3-0.4 empty for every
# SAE; the domain SAEs had it filled by stratified pools, GemmaScope did not.
# Its 0.4-0.5 (n=9), 0.5-0.6 (n=4) and 0.6+ (n=0) cells are the COMPLETE population,
# not a sample: 13 features above r>0.4 in all 16,384 is itself the result.
explicit_features: [[27, "icd9_5990"], [47, "icd9_49390"], [556, "icd9_25000"], [565, "icd9_5849"], [839, "icd9_2724"], [852, "icd9_41401"], [1750, "icd9_2724"], [2187, "icd9_5849"], [2402, "icd9_60000"], [2513, "icd9_311"], [2625, "icd9_5849"], [2907, "icd9_V5867"], [3136, "icd9_V5861"], [3598, "icd9_5849"], [3788, "icd9_3051"], [5093, "icd9_5990"], [5134, "icd9_2449"], [5538, "icd9_2449"], [5582, "icd9_5856"], [5588, "icd9_4019"], [5624, "icd9_V5861"], [5935, "icd9_60000"], [6235, "icd9_4280"], [6407, "icd9_V4986"], [7614, "icd9_4280"], [8281, "icd9_2724"], [8886, "icd9_2449"], [9268, "icd9_486"], [9555, "icd9_5856"], [11047, "icd9_5856"], [11234, "icd9_5849"], [11544, "icd9_V5867"], [12120, "icd9_41401"], [12324, "icd9_4280"], [12448, "icd9_V5867"], [13400, "icd9_4280"], [13632, "icd9_49390"], [13855, "icd9_5856"], [14799, "icd9_5856"], [15641, "icd9_32723"], [15883, "icd9_2449"]]
