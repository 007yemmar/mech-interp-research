# --audit-dir /out/necessity/random_matched/seed0/audit_note_matched --n-grounded 10
# (screened on 80 notes from shard 281; all row0only=0.00). Skewed toward
# icd9_4280 (8/10) -- the natural consequence of top-by-|r| selection, same
# as the vanilla SAE pilot's skew toward icd9_2449 (see
