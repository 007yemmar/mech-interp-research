batch_size: 1
max_notes: null  # full held-out set (~4911 notes)

# --- Output (FRESH directory; do NOT collide with the smoke run) -----------
output_dir: /out/ablation/random_matched_full
shard_checkpoint_subdir: shard_results
save_per_note_records: true

# --- Misc --------------------------------------------------------------------
seed: 42
logging_level: INFO
