# Causal ablation FULL RUN — random-matched directions, directional ablation.
# All 4,911 held-out notes, 10 grounded + 2 screened controls.
#
# Full-scale follow-up to ablation_smoke_random_matched.yaml, which confirmed
# the directional-ablation fix: mean_loss_recon == mean_loss_clean exactly,
# mean_recon_tax == 0.0, and Cliff's delta came back non-degenerate (not the
# 0.0-exactly bug from the splice.mode regression). See .tmp/ablation_handoff.md
# §4 for the failure history and §3.1 for why this arm uses directional
# ablation (x' = x - (x.d)d) instead of the SAE reconstruction protocol.
#
# BASELINE: delta = l_abl - l_clean, NOT l_abl - l_recon (no reconstruction
# step). mean_recon_tax = 0.0 by construction. Absolute nats are NOT
# comparable with the SAE arms (vanilla/jumprelu/gemmascope), which carry
# their own reconstruction tax. Cliff's delta is the comparable quantity
# across arms (within-arm rank contrast; a per-arm baseline offset cancels).
#
# TARGETS BELOW ARE A PLACEHOLDER. Run target selection first:
#
#   modal run scripts/select_ablation_targets.py \
#       --source-dir /out/sources/random_matched_note \
#       --audit-dir /out/necessity/random_matched/seed0/audit_note_matched \
#       --n-grounded 10
#
# This screens candidates for row-0/BOS-only firing (a direction whose
# grounding rests entirely on <bos> is not meaningfully ablatable — see
# docs/2026-08-29-bos-contamination-audit.md) and prints a ready-to-paste
# `targets:` block. Replace the block below with that output, then run:
#
#   MODAL_GPU=A100-40GB modal run --detach modal_app/ablation.py \
#       --config-file configs/ablation_full_random_matched.yaml
#
# Expected runtime: ~4.5 h on A100-40GB (1 + 12x0.38 = 5.56 forward units/note
# x 4,911 notes -- cheaper per-target than the SAE reconstruction protocol
# because there is no un-ablated reconstruction pass to run separately).

# --- Source identity (pseudo-SAE; only W_dec columns are used) -------------
sae_name: random_matched_full
sae_checkpoint_dir: /out/sources/random_matched_note
sae_hf_repo_id: null
sae_hf_filename: null
is_centered: true

# --- Intervention ------------------------------------------------------------
directional_ablation: true
intervention: zero
mean_act_path: null
mean_act_n_shards: 2
mean_act_max_tokens: 100000

# --- Activations / model -----------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
mean_path: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered/mean.pt
centered_activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
model_name: google/gemma-2-2b
layer: 16

# --- Held-out shards -----------------------------------------------------------
held_out_shard_start: 281
held_out_shard_end: 312

# --- ICD label join --------------------------------------------------------
icd_csv_path: /data/sample_50k.csv
join_key: admission_id
text_col: note_text
icd_col_prefix: "icd9_"

# --- Targets (10 grounded + 1 random_control + 1 low_r_control) ------------
