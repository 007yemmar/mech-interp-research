# LLM explanation + concordance for the SAE, STRATIFIED BY |r|.
#
# 40 features in each of |r| 0.2-0.3, 0.3-0.4, 0.4-0.5, 0.5-0.6, 0.6+.
#
# The previous pool was |r|-matched to the SPANNING random pool and came out
# bimodal -- 147 features below |r| 0.2 and 50 above 0.5, with NOTHING between
# 0.3 and 0.5. That hole is exactly where the paper's r>0.4 claim lives, and the
# low band sat below the hard floor's 0.193-0.432 range, so it did not even match
# the null it was meant to match. Those features fire on generic English (from,
# Please, appropriate), making that comparison junk against junk.
#
# Stratifying answers the question the paper actually asks -- at what |r| does
# concordance start working? -- instead of assuming 0.4. The random floor spans
# 0.193-0.432 and so overlays the lower three buckets as a per-bucket null.
#
# Features are sampled RANDOMLY within each bucket, never by rank, so no
# maximisation bias is introduced by the binning. Cached features are preferred
# where a bucket contains them: 43 of 200 already have contexts from the
# credit-failed run, and auto_interp extracts only the difference.
