# anthropic (default) or openrouter. See docs: OpenRouter on this account can
# currently only reach deepseek/deepseek-chat; every other provider 403s.
llm_backend: anthropic
explainer_model: claude-sonnet-4-6
comparison_model: null
n_contexts_train: 20
n_contexts_test: 10
max_tokens_context: 30

# Fuzzing/Detection measure explanation QUALITY (Paulo et al.), not whether
# the judge discriminates, which is the only question this suite asks. They
# are two of the four calls per feature; dropping them halves the spend and
# costs nothing here. The remaining two are load bearing: explain produces the
# explanation, concordance writes the concordance_results.csv that
# concordance_multi_judge re-judges with the panel.
scorers: []

concordance_model: claude-sonnet-4-6
concordance_thresholds: [0.3, 0.4, 0.5]
icd_keywords_yaml_path: /root/configs/icd9_keywords_improved.yaml

model_name: google/gemma-2-2b
# NOTE: run_auto_interp processes features SERIALLY — there is no thread pool,
# executor or rate limiter in auto_interp.py, so no max_workers knob exists. A
# key of that name is silently swallowed by run_auto_interp(**_kwargs). Serial
# execution is also why no 429 protection is needed; the Anthropic SDK retries.
checkpoint_dir: null
logging_level: INFO
