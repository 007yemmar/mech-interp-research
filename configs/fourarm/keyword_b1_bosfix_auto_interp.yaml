# LLM explanation + concordance for sae_jumprelu. THIS IS THE DELIVERABLE STAGE.
#
# explicit_features carries (feature_id, code_name) pairs, not bare ints, so
# concordance judges each direction against the code it was BUILT for rather
# than argmax|r|. Control arms need this: with argmax a keyword direction can
# be judged against a comorbid code and earn a correct NO, which would read as
# the judge failing rather than the pairing being wrong. Populate it from the
# arm's selected_features.csv / top_associations.csv before running.
