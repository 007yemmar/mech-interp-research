# Causal ablation SMOKE config — vanilla SAE, 250 held-out notes, 4 target features.
#
# Purpose: validate Modal infra, splice hook, mean-centering, stats pipeline
# end-to-end before the full pilot, and exercise the activation-in-window
# diagnostic at enough scale to start seeing real signal (n_pos ≈ 10–50 per
# code at this size, vs n_pos = 2–8 at the original 50-note size).
#
# Expected runtime: ~40 min on A100-40GB.
#
# IMPORTANT — schema changed since v1 smoke:
# Per-shard JSON now stores per_feature_mean_act_in_window. The resume logic
# will load old shards without this field (it falls back to NaN), but to
# actually exercise the diagnostic you want a fresh run. Before launching:
#   modal volume rm -r sae-artifacts ablation/vanilla_smoke/shard_results
# (Or accept that the first ~50 notes' rows will have NaN in the in-window
# columns and the remaining ~200 will have real values.)
#
# Run:
#   modal run modal_app/ablation.py --config-file configs/ablation_smoke.yaml

# --- SAE identity ----------------------------------------------------------
sae_name: vanilla_smoke

# Vanilla SAE — best EV checkpoint from the existing pipeline
sae_checkpoint_dir: "/out/saes/sae_d2304_e8_l11e+01_20260505T205723Z/best"
sae_hf_repo_id: null
sae_hf_filename: null

# Vanilla was trained on centered activations
is_centered: true

# --- Activations / model ---------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
mean_path: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered/mean.pt
centered_activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered

model_name: google/gemma-2-2b
layer: 16

# --- Held-out shards -------------------------------------------------------
held_out_shard_start: 281
held_out_shard_end: 312

# --- ICD label join --------------------------------------------------------
icd_csv_path: /data/sample_50k.csv
join_key: admission_id
text_col: note_text
icd_col_prefix: "icd9_"

# --- Targets (pre-selected by ablation_features.select_smoke_targets) ------
# Picked from .tmp/evaluations/vanilla/top_associations.csv:
#   - feature 10520 ↔ icd9_5856 (acute renal failure)        r_pb = 0.8595
#   - feature 8823  ↔ icd9_2449 (hypothyroidism)            r_pb = 0.8581
#   - feature 3593  ↔ icd9_25000 (random control)           r_pb = unknown
#   - feature 16773 ↔ icd9_5849 (low-r control)             r_pb = -0.1002
targets:
  - feature_idx: 10520
    code: icd9_5856
    kind: grounded
    r_pb: 0.8595
  - feature_idx: 8823
    code: icd9_2449
    kind: grounded
    r_pb: 0.8581
  - feature_idx: 3593
    code: icd9_25000
    kind: random_control
    r_pb: null
  - feature_idx: 16773
    code: icd9_5849
    kind: low_r_control
    r_pb: -0.1002

# --- Forward / measurement -------------------------------------------------
max_length: 8192
loss_window_frac: 0.25
min_loss_window_tokens: 32
batch_size: 1
max_notes: 250  # smoke: ~40 min on A100-40GB; n_pos ≈ 10–50 per code

# --- Output ----------------------------------------------------------------
output_dir: /out/ablation/vanilla_smoke
shard_checkpoint_subdir: shard_results
save_per_note_records: true

# --- Misc ------------------------------------------------------------------
seed: 42
logging_level: INFO
