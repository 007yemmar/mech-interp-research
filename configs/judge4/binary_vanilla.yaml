# Fourth judge (Google Gemini 2.5 Flash) — forced-binary YES/NO concordance, vanilla.
# PARTIAL removed from the option set; explanations held fixed, so only the
# option set changes. Completes the arm that RESULTS.md §14.7d records as
# Sonnet + DeepSeek only, so the panel can be reported without DeepSeek.
#
# Setup is byte-identical to configs/fourarm/binary_vanilla.yaml apart from the
# judge: same auto_interp_dir, same output_dir, same prompt and max_tokens.
# max_workers only changes throughput — each verdict is an independent call.
#
# Run: uv run modal run --detach modal_app/binary_judge_eval.py --config-file configs/judge4/binary_vanilla.yaml --detach

auto_interp_dir: /out/auto_interp/vanilla_test_split
output_dir: /out/auto_interp/vanilla_test_split/binary_eval

judges:
  - {slug: gemini-2.5-flash, backend: openrouter, model: google/gemini-2.5-flash}

max_workers: 8
logging_level: INFO
