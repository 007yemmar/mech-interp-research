# Test-split ICD grounding recomputation — vanilla SAE.
#
# Recomputes the [d_sae × n_codes] correlation matrix using only the
# SAE-training held-out shards (default: last 31 of 312). Reads existing
# per-shard pooled vectors from shard_ckpt/ — no SAE re-encode.
#
# Run:
#   modal run modal_app/test_split_eval.py --config-file configs/test_split_eval.yaml
#
# Then re-run posthoc on the test-split dir by setting `eval_output_dir`
# in configs/icd_eval_posthoc.yaml to the `output_dir` below and rerunning:
#   modal run modal_app/icd_eval_posthoc.py --config-file configs/icd_eval_posthoc.yaml
#
# Mirror this config for jumprelu / gemmascope by changing eval_output_dir
# and output_dir to the matching run-id paths.

# --- paths ---------------------------------------------------------------
# Existing icd_eval output dir (has code_names.json + shard_ckpt/)
eval_output_dir: /out/icd_eval/sae_d2304_e8_l11e+01_20260505T205723Z

# ICD-9 binary label CSV used in the original eval (mimic-iv-raw volume)
icd_csv_path: /data/sample_50k.csv

# Where to write the test-split artefacts. Mirrors the standard icd_eval layout
# under a `test_split/` subdir of the source eval dir.
output_dir: /out/icd_eval/sae_d2304_e8_l11e+01_20260505T205723Z/test_split

# Override the source shard_ckpt/ dir (null = eval_output_dir/shard_ckpt)
checkpoint_dir: null

# --- test split (matches SAE training's eval_n_shards: 31) --------------
# Shards [test_shard_start, test_shard_end) are treated as the held-out test
# set. With 312 total shards and the SAE trained with eval_n_shards=31, the
# test set is shards 281..311 inclusive — i.e. start=281, end=312.
test_shard_start: 281
test_shard_end: 312

# --- analysis settings ---------------------------------------------------
fdr_q: 0.05
r_threshold: 0.1

# --- join key (must match original eval) ---------------------------------
join_key: admission_id

# Minimum matched notes after join — fail fast if test split is too small
min_notes: 100

# Copy the 31 test shards' .npy/.jsonl files into output_dir/shard_ckpt/ so
# the existing icd_eval_posthoc.py can run on output_dir unchanged.
# ~150 MB on disk for a 31-shard test split.
copy_shard_ckpt: true

logging_level: INFO
