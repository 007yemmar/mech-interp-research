# JumpReLU s2 concordance replication -- auto_interp, strat pool
#
# PRELIMINARY: SAE = ${jumprelu_run} @ step_00046000 (no LR decay, no final/).
# Protocol = vanilla's: pool selection, r values, contexts and retrieval slates all
# come from the 31 held-out shards (281-311) -- ${jumprelu_eval} covers exactly
# those. Every value other than the paths is copied verbatim from
# configs/judge_vanilla_strat.yaml, so these rows sit next to the published §14 rows.
# Generated 2026-09-26 (spec: docs/superpowers/specs/2026-09-26-jumprelu-s2-concordance-design.md).
#
# uv run modal run --detach modal_app/auto_interp.py --config-file configs/seed_rep/auto_interp_strat200.yaml --detach

# Published 380-feature rule applied to the vanilla SAE, on held-out shards.
#
# Same selection (280 strong at r>0.4 + 100 weak at 0.1-0.3), same prompts and
# thresholds as the published jumprelu run, so results drop straight into the
# R1/R2 tables. For vanilla: 291 features clear r>0.4 (jumprelu: 276), max |r| 0.859 vs 0.864 --
# a like-for-like 380-feature replication of the published run.

# --- paths ---
sae_checkpoint: ${jumprelu_ckpt}
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
icd_eval_dir: ${jumprelu_eval}
# 31 held-out shards, not the 312-shard full checkpoint: auto_interp's shard
# fan-out is bounded only by what note_vectors covers, and the full checkpoint
# drove an 83-minute extraction that never survived to the explainer.
shard_ckpt_dir: ${jumprelu_eval}/shard_ckpt
icd_csv_path: /data/sample_50k.csv
output_dir: ${jumprelu_auto_interp}_strat

# --- feature selection ---
# explicit_features pins the stratified pool, so the tier knobs are inert.
n_strong_grounded: 0
n_weak_grounded: 0
# Noise-floor tiers OFF. The published config carries n_non_grounded: 1000 and
# n_dead: 100, which inflated the selection to 616 (vanilla) and 1213
# (gemmascope) features. Those tiers have no ICD code, so they yield no
# concordance verdict and never enter the banded tables -- ~60% and ~90% of the
# calls respectively bought nothing reportable. They are already established
# for jumprelu, and the architecture question is answered by the grounded
# features alone. Fewer features also shrinks the shard union
# select_shards_for_features returns, so extraction shortens too.
n_non_grounded: 0
n_dead: 0
random_seed: 42

# --- explanation ---
explainer_model: claude-sonnet-4-6
comparison_model: null
n_contexts_train: 20         # activating contexts shown to the explainer
n_contexts_test: 10          # held out for scoring (5 pos, 5 neg)
max_tokens_context: 30       # +/- tokens around trigger token

# --- scoring ---
# Fuzzing/Detection do not affect the concordance verdict and are half the
# calls; the published run included them, this one does not.
scorers: []

# --- post-processing ---
concordance_model: claude-sonnet-4-6
concordance_thresholds:
  - 0.3
  - 0.4
  - 0.5

# --- ICD descriptions (for concordance prompts) ---
icd_keywords_yaml_path: /root/configs/icd9_keywords_improved.yaml

# --- tokenizer ---
model_name: google/gemma-2-2b

# --- resume ---
checkpoint_dir: null         # auto-detected from output_dir

logging_level: INFO

# 40 features per |r| bucket (0.2-0.3 ... 0.6+), matching the JumpReLU stratified
# pool. The published 380-rule leaves 0.3-0.4 EMPTY by construction (strong is
# r>0.4, weak is 0.1-0.3), so vanilla's replication of JumpReLU was approximate
# in exactly the band where hit@1 transitions. 134 of 200 already have contexts
# from the 380 run; auto_interp extracts only the remaining 66.
