# Causal ablation PILOT — JumpReLU SAE, all 4,911 held-out notes, 12 targets.
#
# Completes the three-way causal comparison (vanilla / JumpReLU / GemmaScope).
# Companion to ablation_pilot_vanilla.yaml — identical methodology, identical
# notes, only the SAE changes. Targets generated by
# ablation_features.select_smoke_targets(n_grounded=10, seed=42) against
# .tmp/evaluations/jumprelu/top_associations.csv (top 10 by |r_pb|, deduped by
# latent) + 1 random control + 1 low-r control.
#
# Code coverage of the 10 grounded features:
#   icd9_2449  (hypothyroidism)      : 5 features (2265, 15873, 13990, 12655, 11307)
#   icd9_42731 (atrial fibrillation) : 3 features (6701, 4126, 9163)
#   icd9_5856  (acute renal failure) : 2 features (15821, 12473)
#
# CAVEAT (research gap G14): configs/jumprelu_50k.yaml did NOT set eval_n_shards,
# so shards 281-311 — the held-out set used here — were part of JumpReLU's
# training data. For JumpReLU these notes are IN-SAMPLE (vanilla/GemmaScope held
# them out), so ablation effects may be inflated by memorization. The within-
# feature positive-vs-negative specificity test is partly insulating. Document
# this in the writeup; optionally replicate on true test.csv notes as follow-up.
#
# Expected runtime: ~3 h on A100-40GB (14 forwards/note x 4911 notes).
#
# Run (detached, resumable):
#   modal run --detach modal_app/ablation.py --config-file configs/ablation_pilot_jumprelu.yaml --detach

# --- SAE identity ----------------------------------------------------------
sae_name: jumprelu_pilot

sae_checkpoint_dir: /out/saes/jumprelu_d2304_e8_l01e+01_bw1e+00_20260519T084742Z/step_00036000
sae_hf_repo_id: null
sae_hf_filename: null
is_centered: true

# --- Activations / model ---------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
mean_path: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered/mean.pt
centered_activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered

model_name: google/gemma-2-2b
layer: 16

# --- Held-out shards (identical to vanilla pilot for direct comparison) ----
held_out_shard_start: 281
held_out_shard_end: 312

# --- ICD label join --------------------------------------------------------
icd_csv_path: /data/sample_50k.csv
join_key: admission_id
text_col: note_text
icd_col_prefix: "icd9_"

# --- Targets (10 grounded + 1 random_control + 1 low_r_control) ------------
targets:
  - feature_idx: 6701
    code: icd9_42731
    kind: grounded
    r_pb: 0.8643
  - feature_idx: 15821
    code: icd9_5856
    kind: grounded
    r_pb: 0.8571
  - feature_idx: 2265
    code: icd9_2449
    kind: grounded
    r_pb: 0.8522
  - feature_idx: 4126
    code: icd9_42731
    kind: grounded
    r_pb: 0.8385
  - feature_idx: 15873
    code: icd9_2449
    kind: grounded
    r_pb: 0.8308
  - feature_idx: 13990
    code: icd9_2449
    kind: grounded
    r_pb: 0.827
  - feature_idx: 9163
    code: icd9_42731
    kind: grounded
    r_pb: 0.8172
  - feature_idx: 12473
    code: icd9_5856
    kind: grounded
    r_pb: 0.8112
  - feature_idx: 12655
    code: icd9_2449
    kind: grounded
    r_pb: 0.8106
  - feature_idx: 11307
    code: icd9_2449
    kind: grounded
    r_pb: 0.7994
  - feature_idx: 3921
    code: icd9_25000
    kind: random_control
    r_pb: null
  - feature_idx: 7731
    code: icd9_41401
    kind: low_r_control
    r_pb: 0.1001

# --- Forward / measurement (identical to vanilla pilot) --------------------
max_length: 8192
loss_window_frac: 0.25
min_loss_window_tokens: 32
batch_size: 1
max_notes: null  # full held-out set (~4911 notes)

# --- Output (FRESH directory; do NOT collide with vanilla/gemmascope) ------
output_dir: /out/ablation/jumprelu_pilot
shard_checkpoint_subdir: shard_results
save_per_note_records: true

# --- Misc ------------------------------------------------------------------
seed: 42
logging_level: INFO
