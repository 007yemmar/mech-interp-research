# Causal ablation EXTENDED pilot — GemmaScope SAE, 20 additional grounded features.
#
# Companion to ablation_pilot_gemmascope.yaml. Same SAE, same notes, same
# methodology. Characterises features at ranks 11–30 by |r_pb|; combined with
# the original pilot's top-10 gives 30 grounded features characterised.
#
# No controls in this config — the original pilot already has 2 (16193 random,
# 11107 low-r), both correctly null at scale.
#
# Code coverage of these 20 features (17 distinct codes vs 8 in ranks 1-10):
#   icd9_4280 (heart failure)         : 2 features (16233, 12324)
#   icd9_5856 (acute renal failure)   : 2 features (14799, 9555)
#   icd9_V5867 (insulin)              : 2 features (2907, 11544)
#   icd9_2449 (hypothyroidism)        : 2 features (15883, 8886)
#   icd9_V5861 (anticoag)             : 2 features (5624, 3136)
#   plus 12 codes with 1 feature each, including 4019 (HTN), 5990 (UTI),
#   486 (pneumonia), 2724 (lipid), 311 (depression), 41401 (CAD), etc.
#
# Many of these codes are new vs the rank-1-10 set — substantially broadens
# GemmaScope's tested concept coverage.
#
# Expected runtime: ~5 h on A100-40GB.
#
# Run (detached, resumable):
#   modal run --detach modal_app/ablation.py --config-file configs/ablation_pilot_gemmascope_extended.yaml --detach
#
# Resume: re-run the same command. Per-shard JSONs land in
# /out/ablation/gemma_scope_pilot_extended/shard_results/.

# --- SAE identity ----------------------------------------------------------
sae_name: gemma_scope_pilot_extended

sae_checkpoint_dir: null
sae_hf_repo_id: google/gemma-scope-2b-pt-res
sae_hf_filename: layer_16/width_16k/average_l0_42/params.npz
is_centered: false

# --- Activations / model ---------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z
