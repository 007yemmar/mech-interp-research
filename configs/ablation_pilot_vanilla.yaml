# Causal ablation PILOT — vanilla SAE, all 4,911 held-out notes, 12 targets.
#
# Full-scale follow-up to ablation_smoke.yaml. Same SAE, same methodology,
# same loss window, same statistics — just more targets (10 grounded vs 2)
# and the entire held-out set (4,911 notes vs 250).
#
# Expected runtime: ~3 h on A100-40GB (14 forwards/note × 4911 notes × ~155 ms).
#
# Targets: top 10 features by |r_pb| (deduplicated by latent) + 1 random
# control + 1 low-r control. Generated by ablation_features.select_smoke_targets
# with n_grounded=10 against .tmp/evaluations/vanilla/top_associations.csv.
#
# Code coverage of the 10 grounded features:
#   icd9_2449 (hypothyroidism)        : 5 features (8823, 3485, 12655, 9546, 2868)
#   icd9_5856 (acute renal failure)   : 4 features (10520, 11055, 10471, 13748)
#   icd9_42731 (atrial fibrillation)  : 1 feature  (3569)
# That's the natural skew of top-by-|r| selection — see the design doc §3.5
# for the rationale and the user's pushback on code-anchored alternatives.
#
# Run:
#   modal run --detach modal_app/ablation.py --config-file configs/ablation_pilot_vanilla.yaml --detach

# --- SAE identity ----------------------------------------------------------
sae_name: vanilla_pilot

sae_checkpoint_dir: /out/saes/sae_d2304_e8_l11e+01_20260505T205723Z/best
sae_hf_repo_id: null
sae_hf_filename: null
is_centered: true

# --- Activations / model ---------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
mean_path: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered/mean.pt
centered_activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered

model_name: google/gemma-2-2b
layer: 16

# --- Held-out shards -------------------------------------------------------
held_out_shard_start: 281
held_out_shard_end: 312

# --- ICD label join --------------------------------------------------------
icd_csv_path: /data/sample_50k.csv
join_key: admission_id
text_col: note_text
icd_col_prefix: "icd9_"

# --- Targets (10 grounded + 1 random_control + 1 low_r_control) ------------
targets:
  - feature_idx: 10520
    code: icd9_5856
    kind: grounded
    r_pb: 0.8595
  - feature_idx: 8823
    code: icd9_2449
    kind: grounded
    r_pb: 0.8581
  - feature_idx: 11055
    code: icd9_5856
    kind: grounded
    r_pb: 0.8513
  - feature_idx: 3485
    code: icd9_2449
    kind: grounded
    r_pb: 0.8309
  - feature_idx: 12655
    code: icd9_2449
    kind: grounded
    r_pb: 0.8309
  - feature_idx: 3569
    code: icd9_42731
    kind: grounded
    r_pb: 0.8305
  - feature_idx: 10471
    code: icd9_5856
    kind: grounded
    r_pb: 0.8297
  - feature_idx: 9546
    code: icd9_2449
    kind: grounded
    r_pb: 0.8289
  - feature_idx: 2868
    code: icd9_2449
    kind: grounded
    r_pb: 0.8256
  - feature_idx: 13748
    code: icd9_5856
    kind: grounded
    r_pb: 0.822
  - feature_idx: 3593
    code: icd9_25000
    kind: random_control
    r_pb: null
  - feature_idx: 16773
    code: icd9_5849
    kind: low_r_control
    r_pb: -0.1002

# --- Forward / measurement -------------------------------------------------
max_length: 8192
loss_window_frac: 0.25
min_loss_window_tokens: 32
batch_size: 1
max_notes: null  # full held-out set (~4911 notes)

# --- Output (FRESH directory; do NOT collide with smoke runs) --------------
output_dir: /out/ablation/vanilla_pilot
shard_checkpoint_subdir: shard_results
save_per_note_records: true

# --- Misc ------------------------------------------------------------------
seed: 42
logging_level: INFO
