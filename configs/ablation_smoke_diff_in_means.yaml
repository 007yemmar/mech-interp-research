# Causal ablation SMOKE — DIFFERENCE-IN-MEANS directions, DIRECTIONAL ablation.
# 250 notes, 4 targets. Companion to
# configs/ablation_smoke_random_matched.yaml, whose full run (12 targets,
# 4,911 notes) validated this protocol: mean_loss_recon == mean_loss_clean
# exactly, mean_recon_tax == 0.0, non-degenerate Cliff's delta. See
# .tmp/ablation_handoff.md and docs/causal_ablation_positioning.md,
# "Most valuable experiments" §2/§3 for the full writeup.
#
# WHY DIRECTIONAL, NOT RECONSTRUCTION, FROM THE START
#
# This config previously ran the SAE reconstruction protocol as a smoke test
# (output diff_in_means_smoke, still on Modal, superseded). That measured
# mean_recon_tax = 7.47 nats -- 4.6x the base loss. 46 unit directions in
# 2304 dimensions with b_dec = 0 cannot reconstruct a residual stream; every
# downstream delta was noise on a destroyed baseline (-0.210 grounded, -0.288
# controls). There is no threshold at which that protocol becomes usable for
# this source, so there is no reason to re-measure it -- go straight to
# directional ablation, exactly as random_matched did after hitting the
# equivalent fp16-overflow failure.
#
# THE CORRECT INTERVENTION FOR A DIRECTION
#
#     x' = x - (x . d) d        d unit-norm      (intervention: zero)
#
# Project the direction out of the raw residual stream instead of removing a
# latent from an SAE reconstruction. Arditi et al. (NeurIPS 2024) directional
# ablation; the same projection underlies amnesic probing (Elazar et al.,
# TACL 2021) and INLP (Ravfogel et al., 2020). intervention: zero is primary
# here (not mean) -- the out-of-distribution objection that motivates
# mean-ablation for SAE *features* (F3 in the positioning doc) is about
# clamping a latent zⱼ to a value it never takes; projecting a component out
# of the residual stream leaves x' in the span of everything else, which is a
# materially weaker version of that objection. mean-projection is implemented
# (intervention: mean) if the robustness check is wanted later.
#
# BASELINE CHANGE — read before comparing anything
# delta = l_abl - l_clean, not l_abl - l_recon. mean_recon_tax will be 0.0 by
# construction and the summary records baseline: "clean". Absolute nats are
# NOT comparable with the SAE arms (0.029-0.648 nats of reconstruction
# distortion depending on SAE) OR with random_matched's own l_clean baseline
# in isolation from Cliff's delta -- delta is the comparable quantity across
# every arm, being a within-arm rank contrast that a per-arm baseline offset
# cancels out of.
#
# WHAT GOOD LOOKS LIKE (identical checklist to random_matched's smoke)
#   1. mean_loss_recon == mean_loss_clean and mean_recon_tax == 0.0 exactly.
#      Anything else means the directional branch did not run.
#   2. "directional_ablation": true and "baseline": "clean" in the summary.
#   3. No NaN anywhere.
#   4. Cliff's delta non-zero and non-identical across targets (the
#      splice.mode regression documented in .tmp/ablation_handoff.md §4
#      produces delta == 0.0 exactly for every target -- if that recurs here,
#      stop and re-check splice.mode before reading any number).
#   5. DIRECTIONAL ONLY at n=250 -- do not read the effect sizes themselves.
#
# CENTERING. Directions were built on pooled CENTERED activations; the hook
# sees the uncentered residual. is_centered: true handles mu; b_dec = 0 here
# unlike a trained SAE, but directional ablation never calls decode(), so
# b_dec is irrelevant to this protocol (it mattered only for the abandoned
# reconstruction attempt).
#
# CONTROLS. All 46 diff-in-means directions are label-constructed, so there
# is no max|r|<0.05 pool the way random_matched has one -- every direction
# correlates with SOME code by construction. The two lowest-surviving-|r|
# directions stand in as weak (not null) controls; see
# .tmp/random_matched_ablation_spec.md for the shuffled-label alternative,
# not yet implemented.
#
# Run:
#   MODAL_GPU=A100-40GB modal run modal_app/ablation.py \
#       --config-file configs/ablation_smoke_diff_in_means.yaml

# --- Source identity (pseudo-SAE; only W_dec columns are used) -------------
sae_name: diff_in_means_smoke
sae_checkpoint_dir: /out/sources/dim_full
sae_hf_repo_id: null
sae_hf_filename: null
is_centered: true

# --- Intervention ------------------------------------------------------------
directional_ablation: true
intervention: zero
mean_act_path: null
mean_act_n_shards: 2
mean_act_max_tokens: 100000

# --- Activations / model ---------------------------------------------------
activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
mean_path: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered/mean.pt
centered_activations_dir: /out/activations/google-gemma-2-2b_L16_50000notes_39c5801_20260423T193837Z_centered
model_name: google/gemma-2-2b
layer: 16

# --- Held-out shards -------------------------------------------------------
held_out_shard_start: 281
held_out_shard_end: 312

# --- ICD label join --------------------------------------------------------
icd_csv_path: /data/sample_50k.csv
join_key: admission_id
text_col: note_text
icd_col_prefix: "icd9_"

# --- Targets -----------------------------------------------------------------
# Screened by scripts/select_ablation_targets.py (80 notes, shard 281). 12 of
# 22 candidates were dropped as row0-only=1.00, including ranks 2-7 (latents
# 3, 5, 6, 8, 16, 31, 13 at r=0.469-0.667) -- their grounding sits entirely on
# the BOS token. See docs/2026-08-29-bos-contamination-audit.md.
#
# CONTROLS: none available in the strict sense -- all 46 directions are
# label-constructed, so the max|r|<0.05 and |r| in [0.05,0.10] pools are both
# empty. The two lowest-|r| SURVIVING directions stand in as weak (not null)
# controls, same as the original reconstruction-protocol smoke.
targets:
  - feature_idx: 43
    code: icd9_5856
    kind: grounded
    r_pb: 0.6987
  - feature_idx: 10
    code: icd9_2449
    kind: grounded
    r_pb: 0.5463
  - feature_idx: 33
    code: icd9_V4581
    kind: low_r_control
    r_pb: 0.3864
  - feature_idx: 42
    code: icd9_V5867
    kind: low_r_control
    r_pb: 0.3953

# --- Forward / measurement (identical to the SAE arms) ---------------------
max_length: 8192
loss_window_frac: 0.25
min_loss_window_tokens: 32
batch_size: 1
max_notes: 250

# --- Output ----------------------------------------------------------------
# Fresh dir: the old diff_in_means_smoke on Modal holds reconstruction-
# protocol results (mean_recon_tax = 7.47) and run_ablation resumes by
# skipping shards with an existing shard_*_results.json -- reusing that dir
# would silently re-aggregate the old, superseded per-note records.
output_dir: /out/ablation/diff_in_means_smoke_dir
shard_checkpoint_subdir: shard_results
save_per_note_records: true

# --- Misc ------------------------------------------------------------------
seed: 42
logging_level: INFO
