# Causal ablation EXTENDED pilot — JumpReLU SAE, 20 additional grounded features.
#
# Companion to ablation_pilot_jumprelu.yaml. Same SAE, same notes, same method.
# Characterises features at ranks 11-30 by |r_pb| (the top 10 are in the base
# pilot). Together the two runs give 30 grounded features + 2 controls per SAE,
# matching the vanilla and GemmaScope coverage. Targets generated by
# ablation_features.select_smoke_targets(n_grounded=30, seed=42) against
# .tmp/evaluations/jumprelu/top_associations.csv, grounded ranks 11-30.
#
# No controls here — the base pilot already has 2 (random 3921 + low-r 7731);
# the analysis pools controls from both runs.
#
# Code coverage of these 20 features (10 distinct codes):
#   icd9_42731 (atrial fibrillation) : 4 (9334, 17082, 1557, 4414)
#   icd9_2449  (hypothyroidism)      : 3 (175, 16515, 13319)
#   icd9_5856  (acute renal failure) : 3 (8650, 7492, 9694)
#   icd9_4280  (heart failure)       : 2 (12284, 10179)
#   icd9_53081 (GERD)                : 2 (12251, 16342)
#   icd9_32723 (obstructive sleep apnea) : 2 (7861, 843)
#   icd9_73300 (osteoporosis)        : 1 (3405)
#   icd9_2749  (gout)                : 1 (9833)
#   icd9_60000 (BPH)                 : 1 (8668)
#   icd9_V4581 (cardiac stent)       : 1 (18177)
#
# CAVEAT (G14): same held-out contamination note as the base pilot — shards
# 281-311 were in JumpReLU's training set. Document in writeup.
#
# Expected runtime: ~5 h on A100-40GB (22 forwards/note x 4911 notes).
#
# Run (detached, resumable):
#   modal run --detach modal_app/ablation.py --config-file configs/ablation_pilot_jumprelu_extended.yaml --detach
#
# Resume: re-running the same command picks up from the last completed shard.
# Per-shard JSONs land in /out/ablation/jumprelu_pilot_extended/shard_results/.

# --- SAE identity ----------------------------------------------------------
sae_name: jumprelu_pilot_extended

